<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水云茶堂 - 訂單確認接單</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f7f5f0;
            color: #333;
            padding: 40px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 28px 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h2 { color: #3d2314; font-size: 1.4rem; margin-bottom: 10px; }
        .order-id { font-size: 0.95rem; color: #666; margin-bottom: 20px; font-weight: 500; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { font-size: 0.85rem; font-weight: bold; color: #555; display: block; margin-bottom: 6px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #06c755; }
        .btn {
            width: 100%;
            padding: 14px;
            background-color: #06c755;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #05b34c; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .status-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }
        .status-box.success { background-color: #e8f5e9; color: #2e7d32; }
        .status-box.warning { background-color: #fff3e0; color: #e65100; }
        .status-box.error { background-color: #ffebee; color: #c62828; }
    </style>
</head>
<body>

<div class="card">
    <h2>🍵 水雲茶堂 接單系統</h2>
    <div class="order-id" id="orderDisplay">單號載入中...</div>

    <div id="actionArea">
        <div class="form-group">
            <label for="staffName">接單人員姓名 / 稱呼</label>
            <input type="text" id="staffName" placeholder="請輸入您的名字 (預設：店員)">
        </div>
        <button class="btn" id="acceptBtn" onclick="confirmOrder()">確認接收訂單</button>
    </div>

    <div class="status-box" id="statusMsg"></div>
</div>

<script>
    // ⚠️ 請替換為你發布的 Apps Script 網頁應用程式網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxIczfNOt0qS1mdOM60PEoi52zTigf7Akqz8AZLHn_BbFMuju-dRlB0MLpClff2lvbP/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId') || '';
    const userId = urlParams.get('userId') || ''; // 取出顧客的 userId

    const orderDisplay = document.getElementById('orderDisplay');
    const statusMsg = document.getElementById('statusMsg');
    const actionArea = document.getElementById('actionArea');
    const acceptBtn = document.getElementById('acceptBtn');

    window.onload = function() {
        if (!orderId) {
            orderDisplay.textContent = "❌ 無效的訂單網址";
            actionArea.style.display = "none";
            showStatus("找不到訂單編號，請重新開啟連結。", "error");
            return;
        }

        orderDisplay.textContent = "🧾 訂單編號：" + orderId;
        checkOrderStatus();
    };

    // 檢查訂單是否已被接單
    function checkOrderStatus() {
        fetch(`${GAS_API_URL}?action=checkStatus&orderId=${encodeURIComponent(orderId)}`)
            .then(res => res.json())
            .then(data => {
                if (data.isAccepted) {
                    actionArea.style.display = "none";
                    showStatus(`✅ 該訂單已由 【${data.staffName}】 接收！`, "warning");
                }
            })
            .catch(err => {
                console.error("狀態檢查失敗：", err);
            });
    }

    // 執行確認接單動作
    function confirmOrder() {
        const staffName = document.getElementById('staffName').value.trim() || "店員";
        acceptBtn.disabled = true;
        acceptBtn.textContent = "處理中...";

        // 帶入 action, orderId, staffName 與 userId
        const requestUrl = `${GAS_API_URL}?action=acceptOrder&orderId=${encodeURIComponent(orderId)}&staffName=${encodeURIComponent(staffName)}&userId=${encodeURIComponent(userId)}`;

        fetch(requestUrl)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    actionArea.style.display = "none";
                    showStatus(`🎉 接單成功！接單人員：${data.staffName}`, "success");
                } else {
                    actionArea.style.display = "none";
                    showStatus(`⚠️ ${data.message}`, "warning");
                }
            })
            .catch(err => {
                console.error(err);
                acceptBtn.disabled = false;
                acceptBtn.textContent = "確認接收訂單";
                showStatus("系統連線錯誤，請再試一次。", "error");
            });
    }

    function showStatus(text, type) {
        statusMsg.textContent = text;
        statusMsg.className = `status-box ${type}`;
        statusMsg.style.display = "block";
    }
</script>

</body>
</html>

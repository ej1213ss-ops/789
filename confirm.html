<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水云茶堂 - 訂單確認接單</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F7F5F0;
      color: #333;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #FFFFFF;
      padding: 28px 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h2 {
      color: #3D2314;
      font-size: 1.4rem;
      margin-bottom: 10px;
    }
    .order-badge {
      display: inline-block;
      background: #EFEBE4;
      color: #8C6239;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    .loading-text {
      color: #666;
      font-size: 0.95rem;
      margin: 20px 0;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #DDD;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #06C755;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-active {
      background: #06C755;
      color: white;
    }
    .btn-active:hover {
      background: #05b14c;
    }
    .btn-disabled {
      background: #E0E0E0;
      color: #777777;
      cursor: not-allowed;
    }
    .status-box {
      margin-top: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🍵 訂單接收確認</h2>
    <div class="order-badge" id="display-order-id">載入單號中...</div>
    
    <!-- 載入中狀態 -->
    <div id="loading" class="loading-text">⏳ 正在查詢訂單狀態...</div>
    
    <!-- 未接單：填寫姓名與接單按鈕 -->
    <div id="action-area" style="display: none;">
      <input type="text" id="staff-name" placeholder="請輸入店員姓名 (選填)">
      <button id="accept-btn" class="btn-active" onclick="handleAccept()">✅ 確認接收此訂單</button>
    </div>

    <!-- 已接單：鎖定狀態 -->
    <div id="status-area" style="display: none;">
      <button class="btn-disabled" disabled id="disabled-btn">🔒 該訂單已被接收</button>
      <div class="status-box" id="status-desc"></div>
    </div>
  </div>

  <script>
    // ⚠️ 請填入您的 Google Apps Script 部署網址 (Web App URL)
    const GAS_API_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

    // 從網址獲取 ?orderId=... 參數
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');

    window.onload = function() {
      if (!orderId) {
        document.getElementById('loading').innerText = "⚠️ 網址缺少訂單編號，無法操作";
        document.getElementById('display-order-id').innerText = "無效訂單";
        return;
      }

      document.getElementById('display-order-id').innerText = "訂單編號：" + orderId;

      // 查詢該單號是否已被接收
      fetch(`${GAS_API_URL}?action=checkStatus&orderId=${encodeURIComponent(orderId)}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('loading').style.display = 'none';
          if (data.isAccepted) {
            showAcceptedState(data.staffName);
          } else {
            document.getElementById('action-area').style.display = 'block';
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('loading').innerText = "❌ 載入失敗，請確認連線或重新整理";
        });
    };

    // 點擊確認接單
    function handleAccept() {
      const btn = document.getElementById('accept-btn');
      btn.disabled = true;
      btn.innerText = "處理中...";

      const staffName = document.getElementById('staff-name').value.trim() || "店員";

      fetch(`${GAS_API_URL}?action=acceptOrder&orderId=${encodeURIComponent(orderId)}&staffName=${encodeURIComponent(staffName)}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("✅ 接單成功！已發送通知至 LINE 群組。");
            showAcceptedState(data.staffName);
          } else {
            alert("⚠️ " + data.message);
            showAcceptedState(data.staffName);
          }
        })
        .catch(err => {
          alert("網路連線錯誤，請重試！");
          btn.disabled = false;
          btn.innerText = "✅ 確認接收此訂單";
        });
    }

    // 顯示已接單鎖定畫面
    function showAcceptedState(staffName) {
      document.getElementById('action-area').style.display = 'none';
      document.getElementById('status-area').style.display = 'block';
      
      const nameText = staffName || "店員";
      document.getElementById('disabled-btn').innerText = "🔒 已接收訂單 (" + nameText + ")";
      document.getElementById('status-desc').innerText = "此筆訂單先前已由 「" + nameText + "」 確認接收，請勿重複製作。";
      document.getElementById('status-desc').style.color = "#C2482B";
    }
  </script>
</body>
</html>
